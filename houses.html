<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRTools – Case</title>
<!-- Bump ?v= here and on the common.js import below whenever style.css or common.js changes -->
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<div class="top"><div class="menuwrap hide" id="menuwrap"><button id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu">☰ Menu</button><nav class="menu hide" id="menu"></nav></div><button id="theme" type="button"></button><button id="out" type="button" class="hide">Esci</button></div>

<div class="app hide" id="app">
  <div class="panel">
    <h1>Case</h1>
    <div class="search"><input id="q" type="search" autocomplete="off" placeholder="Cerca nome, indirizzo o note…"><button type="button" class="clear hide" title="Cancella ricerca" aria-label="Cancella ricerca">×</button></div>
    <select class="catsel" id="catsel" aria-label="Filtra per categoria"></select>
    <div class="row"><button class="p" id="add">+ Nuova casa</button></div>
    <div class="mute" id="count"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="panel">
    <div class="mute" id="empty">Seleziona una casa a sinistra o aggiungine una nuova.</div>
    <div id="ed" class="hide">
      <label for="nm">Nome della casa</label>
      <input id="nm">
      <label for="ct">Categoria <span class="mute">(scegline una o scrivine una nuova)</span></label>
      <input id="ct" list="cats" autocomplete="off">
      <datalist id="cats"></datalist>
      <label for="ad">Indirizzo</label>
      <input id="ad">
      <label for="nt">Note</label>
      <div class="edited" id="edited"></div>
      <textarea id="nt" class="notes"></textarea>
      <div class="row">
        <div class="right">
          <span class="mute" id="msg"></span>
          <button class="p" id="save">Salva modifiche</button>
          <button class="d" id="del">Elimina</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { auth, db, formatWhen, initMenu, renderMenu, searchList, initSearchClear } from "./common.js?v=4";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const COL = "properties";
const S = {
  edited: w => "Ultima modifica: " + w, notEdited: "Ultima modifica: non registrata", toDark: "Tema scuro", toLight: "Tema chiaro",
  all: "Tutte le categorie", none: "Senza categoria", shown: (a, b) => a + " di " + b + " visualizzate",
  newName: "Nuova casa", del: "Eliminare questa casa?",
  saved: "Salvato ✓", saveFail: "Impossibile salvare", delFail: "Impossibile eliminare",
  addFail: "Impossibile aggiungere: ", loadFail: "Impossibile caricare i dati: "
};

const $ = i => document.getElementById(i);
let items = [], sel = null, filter = null, unsub = null;
try { filter = localStorage.getItem("mrtools.houseFilter"); } catch (e) {}

const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML.replace(/"/g, "&quot;"); };
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const byName = (a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
function say(t) { $("msg").textContent = t; if (t) setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, 2500); }
function show(w) { $("empty").classList.toggle("hide", w !== "empty"); $("ed").classList.toggle("hide", w !== "ed"); }

// Categories in alphabetical order; houses without one come last as "".
function categories() {
  const c = [...new Set(items.map(x => x.category))].filter(Boolean).sort(byName);
  if (items.some(x => !x.category)) c.push("");
  return c;
}

// The saved filter only applies if that category still exists.
const activeFilter = () => filter !== null && categories().includes(filter) ? filter : null;

function setFilter(f) {
  filter = f;
  try { if (f === null) localStorage.removeItem("mrtools.houseFilter"); else localStorage.setItem("mrtools.houseFilter", f); } catch (e) {}
  render();
}

function render() {
  const t = S, cats = categories(), af = activeFilter();
  const count = c => items.filter(x => x.category === c).length;
  // Option values are positions in `cats`; "" means all categories.
  // Only rebuilt when something changed, so an open dropdown isn't closed.
  const opts = `<option value="">${esc(t.all)} (${items.length})</option>` +
    cats.map((c, i) => `<option value="${i}">${esc(c || t.none)} (${count(c)})</option>`).join("");
  if ($("catsel").dataset.opts !== opts) { $("catsel").innerHTML = opts; $("catsel").dataset.opts = opts; }
  $("catsel").value = af === null ? "" : String(cats.indexOf(af));
  $("cats").innerHTML = cats.filter(Boolean).map(c => `<option value="${esc(c)}">`).join("");

  const f = searchList(items.filter(x => af === null || x.category === af), $("q").value, x => [x.name + " " + x.address, x.category, x.notes]);
  $("count").textContent = t.shown(f.length, items.length);
  $("list").innerHTML = cats.map(c => {
    const g = f.filter(x => x.category === c);
    if (!g.length) return "";
    return `<div class="group">${esc(c || t.none)}</div>` + g.map(x =>
      `<div class="item${x.id === sel ? " on" : ""}" data-id="${x.id}">${esc(x.name || "(—)")}<small>${esc(x.address || (x.notes || "").replace(/\s+/g, " ").slice(0, 70))}</small></div>`).join("");
  }).join("");
}

function fill(x) { $("nm").value = x.name; $("ct").value = x.category; $("ad").value = x.address; $("nt").value = x.notes; }
function showEdited() {
  const x = items.find(i => i.id === sel);
  $("edited").textContent = x && x.updated ? S.edited(formatWhen(x.updated)) : S.notEdited;
}
function open(id) {
  const x = items.find(i => i.id === id); if (!x) return;
  sel = id; fill(x); showEdited(); show("ed"); render();
}

function applyText() {
  renderMenu();
  const dark = isDark(); $("theme").textContent = dark ? "☀" : "☾"; $("theme").title = dark ? S.toLight : S.toDark; $("theme").setAttribute("aria-label", $("theme").title);
  showEdited(); render();
}

const darkMq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkMq.matches ? "dark" : "light")) === "dark";
try { const th = localStorage.getItem("mrtools.theme"); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}
darkMq.addEventListener("change", applyText);
$("theme").onclick = () => {
  const th = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem("mrtools.theme", th); } catch (e) {}
  applyText();
};

$("list").addEventListener("click", e => { const n = e.target.closest(".item"); if (n) open(n.dataset.id); });
$("catsel").addEventListener("change", e => { const v = e.target.value; setFilter(v === "" ? null : categories()[+v]); });
$("q").addEventListener("input", render);
initSearchClear($("q"), render);

$("add").onclick = async () => {
  const id = newId();
  try {
    await setDoc(doc(db, COL, id), { name: S.newName, category: activeFilter() || "", address: "", notes: "", updatedAt: serverTimestamp() });
    sel = id; setTimeout(() => { open(id); $("nm").select(); }, 300);
  } catch (e) { alert(S.addFail + e.message); }
};
$("save").onclick = async () => {
  if (!sel) return;
  try {
    await setDoc(doc(db, COL, sel), { name: $("nm").value.trim(), category: $("ct").value.trim(), address: $("ad").value.trim(), notes: $("nt").value, updatedAt: serverTimestamp() });
    say(S.saved);
  } catch (e) { say(S.saveFail); }
};
$("del").onclick = async () => {
  if (!sel || !confirm(S.del)) return;
  try { await deleteDoc(doc(db, COL, sel)); sel = null; show("empty"); } catch (e) { say(S.delFail); }
};
$("out").onclick = () => signOut(auth);
initMenu();

applyText();

// Sign-in happens on the main page; come back here afterwards.
onAuthStateChanged(auth, user => {
  if (!user) { if (unsub) unsub(); location.replace("index.html"); return; }
  $("app").classList.remove("hide"); $("out").classList.remove("hide"); $("menuwrap").classList.remove("hide");
  unsub = onSnapshot(collection(db, COL), snap => {
    items = snap.docs.map(d => { const v = d.data({ serverTimestamps: "estimate" }); return { id: d.id, name: v.name || "", category: v.category || "", address: v.address || "", notes: v.notes || "", updated: v.updatedAt ? v.updatedAt.toDate() : null }; });
    items.sort((a, b) => byName(a.name, b.name));
    render();
    const busy = ["nm", "ct", "ad", "nt"].includes(document.activeElement && document.activeElement.id);
    if (sel && !busy && !$("ed").classList.contains("hide")) { const x = items.find(i => i.id === sel); if (x) fill(x); }
    if (sel) showEdited();
  }, err => { $("empty").textContent = S.loadFail + err.message; });
});
</script>
</body>
</html>
