<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRTools</title>
<!-- Bump ?v= here and on the common.js import below whenever style.css or common.js changes -->
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<div class="top"><div class="menuwrap hide" id="menuwrap"><button id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu">☰ Menu</button><nav class="menu hide" id="menu"></nav></div><button id="theme" type="button"></button><button id="out" type="button" class="hide">Esci</button></div>

<div id="login" class="hide">
  <div class="panel">
    <h1>MRTools</h1>
    <form id="lf">
      <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <div class="row"><button class="p" type="submit">Accedi</button><button type="button" id="reset">Password dimenticata</button></div>
      <div class="mute" id="lmsg"></div>
    </form>
  </div>
</div>

<div class="app hide" id="app">
  <div class="panel">
    <h1>MRTools</h1>
    <div class="tabs" id="tabs"><button data-cat="houses" class="on">Check-in</button><button data-cat="messages">Messaggi</button></div>
    <div class="search"><input id="q" type="search" autocomplete="off"><button type="button" class="clear hide" title="Cancella ricerca" aria-label="Cancella ricerca">×</button></div>
    <div class="row"><button class="p" id="add">+ Nuovo</button><button id="imp">Importa in blocco</button></div>
    <div class="mute" id="count"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="panel">
    <div class="mute" id="empty"></div>
    <div id="ed" class="hide">
      <label for="nm" id="nmlbl"></label>
      <input id="nm">
      <label for="tx" id="txlbl"></label>
      <div class="edited" id="edited"></div>
      <div class="ltabs" id="ltabs" role="tablist"></div>
      <div class="mute nolang hide" id="nolang">Nessuna lingua ancora: aggiungine una con +.</div>
      <textarea id="tx"></textarea>
      <div class="row" id="copyrow"><button class="p" id="copy"></button></div>
      <div id="exwrap">
        <label for="ex">Note extra</label>
        <textarea id="ex" class="notes"></textarea>
        <div class="row"><button class="p" id="copyex">Copia note</button></div>
      </div>
      <div class="row">
        <div class="right">
          <span class="mute" id="msg"></span>
          <button id="save">Salva modifiche</button>
          <button class="d" id="del">Elimina</button>
        </div>
      </div>
    </div>
    <div id="imppane" class="hide">
      <label for="imptx" id="implbl"></label>
      <textarea id="imptx"></textarea>
      <div class="row"><button class="p" id="impgo">Importa</button><button id="impx">Annulla</button><span class="mute" id="impmsg"></span></div>
    </div>
  </div>
</div>

<script type="module">
import { auth, db, formatWhen, initMenu, renderMenu, searchList, initSearchClear } from "./common.js?v=8";
import { onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Language of entries saved before language tabs existed, and of bulk-imported text.
const FIRST_LANG = "English";

const S = {
  edited: w => "Ultima modifica: " + w, notEdited: "Ultima modifica: non registrata", toDark: "Tema scuro", toLight: "Tema chiaro",
  wrongLogin: "Email o password errati.", typeEmail: "Scrivi prima la tua email.",
  resetSent: "Se l'account esiste, è stata inviata un'email per reimpostare la password.", resetFail: "Impossibile inviare l'email di reimpostazione.",
  shown: (a, b) => a + " di " + b + " visualizzati",
  saved: "Salvato ✓", saveFail: "Impossibile salvare", delFail: "Impossibile eliminare", copied: "Copiato ✓", copyFail: "Copia non riuscita",
  addFail: "Impossibile aggiungere: ", nothing: "Niente da importare", impFail: "Importazione non riuscita: ", loadFail: "Impossibile caricare i dati: ",
  imp: t => `Incolla più voci insieme. Separa le voci con una riga che contiene solo <b>###</b>. La prima riga di ogni blocco è il nome, il resto è ${t} (in ${FIRST_LANG}).`,
  renameHint: "Doppio clic per rinominare", renameLabel: "Nome della lingua", langExists: "Questa lingua c'è già in questa voce.",
  addLang: "Aggiungi lingua", newLang: "Nome della nuova lingua (es. Italiano):", removeLang: "Elimina questa lingua",
  confirmRemoveLang: l => `Eliminare la versione "${l}" da questa voce? Diventa definitivo quando salvi.`,
  unsaved: "Ci sono modifiche non salvate in questa voce. Vuoi scartarle?",
  houses: { q: "Cerca casa, stanza o testo…", empty: "Seleziona una casa a sinistra o aggiungine una nuova.", nm: "Nome casa / stanza", tx: "Istruzioni", copy: "Copia istruzioni", imp: "le istruzioni", newName: "Nuova casa", del: "Eliminare questa casa e le sue istruzioni?" },
  messages: { q: "Cerca messaggi…", empty: "Seleziona un messaggio a sinistra o aggiungine uno nuovo.", nm: "Titolo del messaggio", tx: "Messaggio", copy: "Copia messaggio", imp: "il messaggio", newName: "Nuovo messaggio", del: "Eliminare questo messaggio?" }
};
const CATS = { houses: 1, messages: 1 };
const C = () => S[cat];

const $ = i => document.getElementById(i);
let data = { houses: [], messages: [] }, cat = "houses", sel = null, unsubs = [];
try { if (CATS[localStorage.getItem("mrtools.cat")]) cat = localStorage.getItem("mrtools.cat"); } catch (e) {}
const items = () => data[cat];

// Editor state for the open entry: its language versions, which one is shown,
// whether anything changed since it was loaded or saved, and what was loaded.
let draft = null, dirty = false, loaded = "";
// Language tab to show first when opening an entry (the last one you picked).
let prefLang = FIRST_LANG;
try { prefLang = localStorage.getItem("mrtools.textLang") || FIRST_LANG; } catch (e) {}

const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML.replace(/"/g, "&quot;"); };
const newId = () => "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function say(t) { $("msg").textContent = t; if (t) setTimeout(() => { if ($("msg").textContent === t) $("msg").textContent = ""; }, 2500); }
function show(w) { $("empty").classList.toggle("hide", w !== "empty"); $("ed").classList.toggle("hide", w !== "ed"); $("imppane").classList.toggle("hide", w !== "imp"); }
const okToLeave = () => !dirty || confirm(S.unsaved);

// Entries saved before language tabs have a single `text`: show it as the English
// version, or no tabs if it was empty. Saved tabs are kept even while their text is empty.
// Each tab has its own extra notes. Notes saved before that (one `extra` for the whole
// entry) are copied into every tab; if the entry has no tabs yet they are kept in `extra`
// and go into the first language added.
function toEntry(d) {
  const v = d.data({ serverTimestamps: "estimate" });
  const shared = v.extra || "";
  const texts = Array.isArray(v.texts)
    ? v.texts.map(t => ({ lang: String(t.lang || FIRST_LANG), text: String(t.text || ""), extra: typeof t.extra === "string" ? t.extra : shared }))
    : (v.text || "").trim() ? [{ lang: FIRST_LANG, text: v.text, extra: shared }] : [];
  return { id: d.id, name: v.name || "", texts, extra: texts.length ? "" : shared, updated: v.updatedAt ? v.updatedAt.toDate() : null };
}

function renderList() {
  const f = searchList(items(), $("q").value, x => [x.name, x.texts.map(t => t.text + " " + t.extra).join(" "), x.extra]);
  $("count").textContent = S.shown(f.length, items().length);
  $("list").innerHTML = f.map(x =>
    `<div class="item${x.id === sel ? " on" : ""}" data-id="${x.id}">${esc(x.name || "(senza nome)")}<small>${esc((x.texts.length ? x.texts[0].text : "").replace(/\s+/g, " ").slice(0, 70))}</small></div>`).join("");
}
function showEdited() {
  const x = items().find(i => i.id === sel);
  $("edited").textContent = x && x.updated ? S.edited(formatWhen(x.updated)) : S.notEdited;
}

// Language tabs above the text box. Every tab has a × (only visible on the open
// one, via CSS) so switching tabs only moves the highlight; redrawing on click
// would stop double-click from reaching the tab.
function renderLangTabs() {
  const many = draft.texts.length > 1;
  $("ltabs").innerHTML = draft.texts.map((t, i) => {
    const on = i === draft.active;
    return `<button type="button" class="ltab${on ? " on" : ""}" role="tab" aria-selected="${on}" data-i="${i}" title="${S.renameHint}">${esc(t.lang)}` +
      (many ? `<span class="lx" data-x="${i}" title="${S.removeLang}" aria-label="${S.removeLang}">×</span>` : "") + `</button>`;
  }).join("") + `<button type="button" class="ltab add" data-add="1" title="${S.addLang}" aria-label="${S.addLang}">+</button>`;
}
// Shows language i in the text box; -1 means the entry has no languages yet.
function showLang(i) {
  draft.active = i;
  const none = i < 0;
  $("tx").classList.toggle("hide", none); $("exwrap").classList.toggle("hide", none); $("copyrow").classList.toggle("hide", none); $("nolang").classList.toggle("hide", !none);
  $("tx").value = none ? "" : draft.texts[i].text;
  $("ex").value = none ? "" : draft.texts[i].extra;
  $("ltabs").querySelectorAll(".ltab[data-i]").forEach(b => { const on = +b.dataset.i === i; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
}
// Redraws the tabs (after languages were added, removed or renamed) and shows language i.
function redraw(i) { draft.active = i; renderLangTabs(); showLang(i); }
// draft.extra holds old whole-entry notes of an entry without tabs, until a language is added.
function load(x) {
  draft = { texts: x.texts.map(t => ({ ...t })), extra: x.extra, active: 0 };
  const i = draft.texts.findIndex(t => t.lang === prefLang);
  $("nm").value = x.name;
  redraw(!draft.texts.length ? -1 : i < 0 ? 0 : i);
  dirty = false; loaded = JSON.stringify([x.name, x.texts, x.extra]);
}
function open(id) {
  if (id !== sel && !okToLeave()) return;
  const x = items().find(i => i.id === id); if (!x) return;
  sel = id; load(x); showEdited(); show("ed"); renderList();
}

$("list").addEventListener("click", e => { const n = e.target.closest(".item"); if (n) open(n.dataset.id); });
$("q").addEventListener("input", renderList);
initSearchClear($("q"), renderList);

$("ltabs").addEventListener("click", e => {
  const x = e.target.closest(".lx"), b = e.target.closest(".ltab");
  if (x) {
    const i = +x.dataset.x;
    if (!confirm(S.confirmRemoveLang(draft.texts[i].lang))) return;
    draft.texts.splice(i, 1); dirty = true;
    redraw(Math.min(i, draft.texts.length - 1));
  } else if (b && b.dataset.add) {
    const name = (prompt(S.newLang) || "").trim();
    if (!name) return;
    let i = draft.texts.findIndex(t => t.lang.toLowerCase() === name.toLowerCase());
    if (i < 0) { draft.texts.push({ lang: name, text: "", extra: draft.extra }); draft.extra = ""; i = draft.texts.length - 1; dirty = true; }
    prefLang = draft.texts[i].lang;
    redraw(i); $("tx").focus();
  } else if (b) {
    showLang(+b.dataset.i);
    prefLang = draft.texts[draft.active].lang;
  } else return;
  try { localStorage.setItem("mrtools.textLang", prefLang); } catch (e) {}
});

// Rename a language: double-click its tab (or F2), then Enter / click away to keep, Esc to cancel.
function renameLang(i) {
  const b = $("ltabs").querySelector(`.ltab[data-i="${i}"]`); if (!b) return;
  const inp = document.createElement("input");
  inp.className = "lname"; inp.value = draft.texts[i].lang; inp.setAttribute("aria-label", S.renameLabel);
  const fit = () => { inp.size = Math.max(6, inp.value.length + 1); };
  let done = false;
  const finish = keep => {
    if (done) return; done = true;
    const old = draft.texts[i].lang, name = inp.value.trim();
    if (keep && name && name !== old) {
      if (draft.texts.some((t, j) => j !== i && t.lang.toLowerCase() === name.toLowerCase())) alert(S.langExists);
      else {
        draft.texts[i].lang = name; dirty = true;
        if (prefLang === old) { prefLang = name; try { localStorage.setItem("mrtools.textLang", prefLang); } catch (e) {} }
      }
    }
    redraw(draft.active);
  };
  inp.addEventListener("input", fit);
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
  inp.addEventListener("blur", () => finish(true));
  fit(); b.replaceWith(inp); inp.focus(); inp.select();
}
$("ltabs").addEventListener("dblclick", e => { const b = e.target.closest(".ltab[data-i]"); if (b && !e.target.closest(".lx")) renameLang(+b.dataset.i); });
$("ltabs").addEventListener("keydown", e => { const b = e.target.closest(".ltab[data-i]"); if (b && e.key === "F2") { e.preventDefault(); renameLang(+b.dataset.i); } });
$("tx").addEventListener("input", () => { draft.texts[draft.active].text = $("tx").value; dirty = true; });
$("nm").addEventListener("input", () => { dirty = true; });
$("ex").addEventListener("input", () => { draft.texts[draft.active].extra = $("ex").value; dirty = true; });

function applyText() {
  const c = C();
  renderMenu();
  const dark = isDark(); $("theme").textContent = dark ? "☀" : "☾"; $("theme").title = dark ? S.toLight : S.toDark; $("theme").setAttribute("aria-label", $("theme").title);
  $("q").placeholder = c.q; $("nmlbl").textContent = c.nm; $("txlbl").textContent = c.tx; if ($("copy").dataset.label) $("copy").dataset.label = c.copy; else $("copy").textContent = c.copy; $("implbl").innerHTML = S.imp(c.imp);
  if (!$("empty").dataset.err) $("empty").textContent = c.empty;
  showEdited(); renderList();
}
function setCat(c) {
  cat = c; sel = null; draft = null; dirty = false;
  try { localStorage.setItem("mrtools.cat", c); } catch (e) {}
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.cat === c));
  delete $("empty").dataset.err;
  show("empty"); applyText();
}
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.cat !== cat && okToLeave()) setCat(b.dataset.cat); });
const darkMq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkMq.matches ? "dark" : "light")) === "dark";
try { const th = localStorage.getItem("mrtools.theme"); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}
darkMq.addEventListener("change", applyText);
$("theme").onclick = () => {
  const th = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem("mrtools.theme", th); } catch (e) {}
  applyText();
};
setCat(cat);

$("add").onclick = async () => {
  if (!okToLeave()) return;
  const id = newId();
  try {
    await setDoc(doc(db, cat, id), { name: C().newName, texts: [], updatedAt: serverTimestamp() });
    dirty = false; setTimeout(() => { open(id); $("nm").select(); }, 300);
  } catch (e) { alert(S.addFail + e.message); }
};
$("save").onclick = async () => {
  if (!sel) return;
  const name = $("nm").value.trim(), texts = draft.texts.map(t => ({ lang: t.lang, text: t.text, extra: t.extra })), extra = draft.extra;
  // Typing during the save marks the entry as changed again.
  dirty = false; loaded = JSON.stringify([name, texts, extra]);
  const data = { name, texts, updatedAt: serverTimestamp() };
  if (extra) data.extra = extra;
  try {
    await setDoc(doc(db, cat, sel), data);
    say(S.saved);
  } catch (e) { dirty = true; say(S.saveFail); }
};
$("del").onclick = async () => {
  if (!sel || !confirm(C().del)) return;
  try { await deleteDoc(doc(db, cat, sel)); sel = null; draft = null; dirty = false; show("empty"); } catch (e) { say(S.delFail); }
};
// Copies text and briefly shows the result on the button that was clicked.
function copyText(t, btn) {
  const done = ok => {
    clearTimeout(btn._t); if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = ok ? S.copied : S.copyFail;
    btn._t = setTimeout(() => { btn.textContent = btn.dataset.label; delete btn.dataset.label; }, 1500);
  };
  const fb = () => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} a.remove(); done(ok); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => done(true), fb); else fb();
}
$("copy").onclick = () => copyText($("tx").value, $("copy"));
$("copyex").onclick = () => copyText($("ex").value, $("copyex"));
$("imp").onclick = () => { if (!okToLeave()) return; sel = null; draft = null; dirty = false; renderList(); show("imp"); $("impmsg").textContent = ""; };
$("impx").onclick = () => show("empty");
$("impgo").onclick = async () => {
  const blocks = $("imptx").value.split(/^\s*###\s*$/m).map(b => b.trim()).filter(Boolean);
  if (!blocks.length) { $("impmsg").textContent = S.nothing; return; }
  try {
    await Promise.all(blocks.map(b => {
      const l = b.split("\n"), name = l.shift().trim();
      return setDoc(doc(db, cat, newId()), { name, texts: [{ lang: FIRST_LANG, text: l.join("\n").trim(), extra: "" }], updatedAt: serverTimestamp() });
    }));
    $("imptx").value = ""; show("empty");
  } catch (e) { $("impmsg").textContent = S.impFail + e.message; }
};

// Login
$("lf").addEventListener("submit", async e => {
  e.preventDefault(); $("lmsg").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch (err) { $("lmsg").textContent = S.wrongLogin; }
});
$("reset").onclick = async () => {
  const em = $("em").value.trim();
  if (!em) { $("lmsg").textContent = S.typeEmail; return; }
  try { await sendPasswordResetEmail(auth, em); $("lmsg").textContent = S.resetSent; } catch (e) { $("lmsg").textContent = S.resetFail; }
};
$("out").onclick = () => { if (okToLeave()) signOut(auth); };
initMenu();

onAuthStateChanged(auth, user => {
  if (user) {
    $("login").classList.add("hide"); $("app").classList.remove("hide"); $("out").classList.remove("hide"); $("menuwrap").classList.remove("hide");
    unsubs = Object.keys(CATS).map(c => onSnapshot(collection(db, c), snap => {
      const list = snap.docs.map(toEntry);
      list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
      data[c] = list;
      if (c !== cat) return;
      renderList();
      // Pick up changes saved elsewhere, unless there are unsaved edits here.
      const x = sel && list.find(i => i.id === sel);
      if (x && !dirty && JSON.stringify([x.name, x.texts, x.extra]) !== loaded) { if (draft.active >= 0) prefLang = draft.texts[draft.active].lang; load(x); }
      if (sel) showEdited();
    }, err => { if (c === cat) { $("empty").dataset.err = 1; $("empty").textContent = S.loadFail + err.message; } }));
  } else {
    unsubs.forEach(u => u()); unsubs = [];
    data = { houses: [], messages: [] }; sel = null; draft = null; dirty = false; show("empty");
    $("app").classList.add("hide"); $("out").classList.add("hide"); $("menuwrap").classList.add("hide"); $("login").classList.remove("hide");
  }
});
</script>
</body>
</html>
